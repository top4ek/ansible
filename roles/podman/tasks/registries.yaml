---
- name: Ensure registries.conf.d exists
  become: true
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point podman at the local registry mirrors
  become: true
  ansible.builtin.template:
    src: registries-mirror.conf.j2
    dest: /etc/containers/registries.conf.d/10-local-mirror.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - registry_cache_client | bool
    - (registry_cache_upstreams | default({})) | length > 0

- name: Remove local registry mirrors
  become: true
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d/10-local-mirror.conf
    state: absent
  when: not (registry_cache_client | bool) or (registry_cache_upstreams | default({}) | length == 0)
