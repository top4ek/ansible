---
- name: Set PostgreSQL paths
  ansible.builtin.set_fact:
    postgresql_data_dir: "{{ postgresql_container_dir }}/data"
    # postgresql_backup_dir: "{{ postgresql_compose_dir }}/backups"

- name: Check for existing cluster version
  become: true
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: postgresql_pgversion_file

- name: Read existing cluster version
  become: true
  ansible.builtin.slurp:
    src: "{{ postgresql_data_dir }}/PG_VERSION"
  register: postgresql_pgversion_raw
  when: postgresql_pgversion_file.stat.exists

- name: Set installed cluster version fact
  ansible.builtin.set_fact:
    postgresql_installed_version: "{{ (postgresql_pgversion_raw.content | b64decode | trim) if postgresql_pgversion_file.stat.exists else (postgresql_version | string) }}"

- name: Run major version upgrade
  ansible.builtin.include_tasks: upgrade.yaml
  when: postgresql_installed_version != (postgresql_version | string)

- name: Run container
  ansible.builtin.include_role:
    name: podman
    tasks_from: container.yaml
  vars:
    container_name: "{{ postgresql_container_name }}"
    podman_recreate: "{{ postgresql_upgrade_pending | default(false) }}"

- name: Wait for postgresql.conf to be created
  ansible.builtin.wait_for:
    path: "{{ postgresql_data_dir }}/postgresql.conf"
    timeout: 120

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    mode: "0644"
  notify: Reload PostgreSQL

- name: Ensure conf directory exists
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/conf.d"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Deploy custom PostgreSQL config
  ansible.builtin.template:
    src: custom.conf.j2
    dest: "{{ postgresql_data_dir }}/conf.d/custom.conf"
    mode: "0644"
  notify: Reload PostgreSQL

- name: Include custom configs
  ansible.builtin.lineinfile:
    regexp: "^#include_dir = "
    line: "include_dir = 'conf.d'"
    state: present
    path: "{{ postgresql_data_dir }}/postgresql.conf"
  notify: Reload PostgreSQL

- name: Flush handlers to force restart after config updates
  ansible.builtin.meta: flush_handlers

- name: Install distribution-specific packages
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yaml"

- name: Wait for PostgreSQL to accept TCP connections on localhost
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ postgresql_conf.port | default(5432) }}"
    timeout: 120

- name: Restore cluster dump after major upgrade
  ansible.builtin.include_tasks: upgrade_restore.yaml
  when: postgresql_upgrade_pending | default(false) | bool

- name: Set superuser password
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    state: present
    login_host: localhost
    login_port: "{{ postgresql_conf.port | default(5432) }}"
    login_user: "{{ postgresql_user | default('postgres') }}"
    login_password: "{{ postgresql_password }}"
    expires: infinity

- name: Create roles
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    state: present
    login_host: localhost
    login_port: "{{ postgresql_conf.port | default(5432) }}"
    login_user: "{{ postgresql_user | default('postgres') }}"
    login_password: "{{ postgresql_password }}"
  loop: "{{ postgresql_databases }}"

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.database }}"
    owner: "{{ item.user }}"
    encoding: "{{ item.encoding | default(omit) }}"
    lc_collate: "{{ item.lc_collate | default(omit) }}"
    lc_ctype: "{{ item.lc_ctype | default(omit) }}"
    template: "{{ item.template | default(omit) }}"
    state: present
    login_host: localhost
    login_port: "{{ postgresql_conf.port | default(5432) }}"
    login_user: "{{ postgresql_user | default('postgres') }}"
    login_password: "{{ postgresql_password }}"
  loop: "{{ postgresql_databases }}"

- name: Grant database privileges
  community.postgresql.postgresql_privs:
    type: database
    login_db: "{{ item.database }}"
    roles: "{{ item.user }}"
    grant_option: no
    privs: all
    login_host: localhost
    login_port: "{{ postgresql_conf.port | default(5432) }}"
    login_user: "{{ postgresql_user | default('postgres') }}"
    login_password: "{{ postgresql_password }}"
  loop: "{{ postgresql_databases }}"
