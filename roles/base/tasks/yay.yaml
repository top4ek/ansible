- name: Check if yay available
  ansible.builtin.command: yay --version
  ignore_errors: true
  register: yayresult

- name: Install build dependencies
  become: true
  ansible.builtin.package:
    name:
      - fakeroot
      - git
      - base-devel
    state: present
    update_cache: true
  when: "yayresult.rc != 0"

- name: Checkout sources
  ansible.builtin.git:
    repo: "https://aur.archlinux.org/yay.git"
    dest: "/home/{{ admin_user }}/yay"
  when: "yayresult.rc != 0"

- name: Build and install yay
  ansible.builtin.shell:
    cmd: makepkg -si --noconfirm
    chdir: "/home/{{ admin_user }}/yay"
  when: "yayresult.rc != 0"

- name: Remove sources
  ansible.builtin.file:
    state: absent
    path: "/home/{{ admin_user }}/yay"
  when: "yayresult.rc != 0"

- name: Show packages
  ansible.builtin.debug:
    msg: "{{ packages }}"
  when: "packages is defined"

- name: Install batch of packages
  ansible.builtin.command: >
    yay -S
      --answerclean none --answeredit none --answerupgrade none --answerdiff none
      --removemake --noconfirm --combinedupgrade --needed
      {% for pkg in packages %} {{ pkg | quote }} {% endfor %}
  when: "packages is defined"
