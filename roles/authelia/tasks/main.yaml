---
- name: Ensure required authelia host variables are defined
  ansible.builtin.assert:
    that:
      - authelia is defined
      - authelia.ldap_password is defined
      - authelia.session_secret is defined
      - authelia.storage_key is defined
      - authelia.jwt_secret is defined
    fail_msg: "authelia host_vars incomplete"

- name: Create authelia config directory
  ansible.builtin.file:
    path: "{{ authelia_container_dir }}/config"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Render authelia configuration
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_container_dir }}/config/configuration.yml"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  register: authelia_config

- name: Validate rendered Authelia configuration
  become: true
  become_user: "{{ admin_user }}"
  environment: "{{ podman_rootless_environment }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - run
      - --rm
      - --pull=missing
      - -v
      - "{{ authelia_container_dir }}/config:/config:ro"
      - "{{ authelia_image }}"
      - authelia
      - config
      - validate
      - --config
      - /config/configuration.yml
  register: authelia_validation
  changed_when: false
  failed_when: false
  when: authelia_config is changed and not ansible_check_mode

- name: Assert Authelia configuration is valid
  ansible.builtin.assert:
    that: authelia_validation.rc == 0
    fail_msg: "Authelia rejected its rendered configuration; inspect it on the target before applying"
  when: authelia_config is changed and not ansible_check_mode

- name: Deploy authelia container
  ansible.builtin.include_role:
    name: podman
    tasks_from: container.yaml
  vars:
    container_name: "{{ authelia_container_name }}"
    podman_recreate: "{{ authelia_config is changed }}"
