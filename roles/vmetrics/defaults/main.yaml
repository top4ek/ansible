---
vmetrics_container_name: "vmetrics"
vmetrics_container_dir: "/home/{{ admin_user }}/containers/{{ vmetrics_container_name }}"
vmetrics_image: "docker.io/victoriametrics/victoria-metrics"

vmetrics_bind_address: "127.0.0.1"

