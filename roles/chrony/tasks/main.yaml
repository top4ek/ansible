---
- name: Install Chrony
  become: true
  ansible.builtin.package:
    name: chrony
    update_cache: true

- name: Configure Chrony
  become: true
  ansible.builtin.template:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "644"
  notify: Restart Chrony

- name: Enable chronyd
  become: true
  ansible.builtin.service:
    name: chronyd
    enabled: true
