- name: Remove superseded sysctl drop-ins
  become: true
  ansible.builtin.file:
    path: "/etc/sysctl.d/{{ item }}"
    state: absent
  loop:
    - ipv4.conf
    - ipv6.conf
    - 99-ipv6.conf

- name: Set network sysctl flags
  become: true
  ansible.builtin.template:
    src: sysctl-network.conf.j2
    dest: /etc/sysctl.d/10-network.conf
    owner: root
    group: root
    mode: "0644"
  register: network_sysctl

- name: Apply network sysctl flags
  become: true
  ansible.builtin.command: sysctl -e -p /etc/sysctl.d/10-network.conf
  changed_when: true
  when: network_sysctl is changed

- name: Deleting old firewall daemons
  become: true
  ansible.builtin.package:
    state: absent
    name:
      - firewalld
    update_cache: yes

- name: Gather service facts for NetworkManager detection
  ansible.builtin.service_facts:
  when: network_backend == 'auto'

- name: Detect NetworkManager backend
  ansible.builtin.set_fact:
    network_use_networkmanager: >-
      {{
        network_backend == 'networkmanager'
        or (
          network_backend == 'auto'
          and (
            'NetworkManager.service' in (ansible_facts.services | default({}))
            or 'NetworkManager' in (ansible_facts.services | default({}))
          )
        )
      }}

- name: Rename legacy /etc/network/interfaces when using NetworkManager
  become: true
  ansible.builtin.command:
    cmd: mv /etc/network/interfaces /etc/network/interfaces-old
  args:
    removes: /etc/network/interfaces
    creates: /etc/network/interfaces-old
  when: network_use_networkmanager
  changed_when: true

- name: Configure network interfaces
  ansible.builtin.include_tasks: networking.yaml
  when: interfaces is defined

- name: Configure WireGuard
  ansible.builtin.include_tasks: wireguard.yaml
  when: wireguard is defined and wireguard.interfaces is defined

- name: Configure nftables
  ansible.builtin.include_tasks: nftables.yaml
  when: interfaces is defined
