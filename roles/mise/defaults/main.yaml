---
# Общий с roles/asdf список инструментов; роли взаимоисключающие, форма одна.
# Версии только собираются и становятся доступны - активной версию делает
# тулфайл проекта (.ruby-version и т.п.), вне проекта работает системный
# бинарь. Глобального пина нет.
# dev_tools:
#   <tool>:
#     version: <версия; "system" - не ставить ничего>
#     src: <git url плагина; нужен только asdf и только вне официального списка, mise игнорирует>
dev_tools: {}

dev_tools_idiomatic:
  - crystal
  - deno
  - dotnet
  - elixir
  - go
  - java
  - node
  - perl
  - python
  - ruby
  - rust
  - swift
  - zig
