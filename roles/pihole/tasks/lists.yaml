---
- name: Wait for the Pi-hole lists API
  ansible.builtin.include_tasks: wait_api.yaml

- name: Compute Pi-hole blocklist changes
  ansible.builtin.set_fact:
    pihole_lists_to_add: "{{ desired | difference(current) }}"
    pihole_lists_to_delete: "{{ current | difference(desired) }}"
    pihole_lists_changed: "{{ desired | symmetric_difference(current) | length > 0 }}"
  vars:
    desired: "{{ pihole.lists | map('trim') | reject('equalto', '') | list }}"
    current: >-
      {{ (pihole_lists_probe.stdout | from_json).lists | map(attribute='address') | list }}

- name: Authenticate with Pi-hole API
  ansible.builtin.uri:
    method: POST
    url: "http://127.0.0.1/api/auth"
    body_format: json
    body:
      password: "{{ pihole.webpassword }}"
    status_code: [200, 201]
    timeout: "{{ pihole_api_timeout }}"
  register: pihole_auth
  changed_when: false
  when: pihole_lists_changed

- name: Set Pi-hole API session id
  ansible.builtin.set_fact:
    pihole_api_sid: "{{ pihole_auth.json.session.sid }}"
  failed_when: pihole_api_sid | length == 0
  when: pihole_lists_changed

- name: POST blocklist URLs to Pi-hole API
  ansible.builtin.uri:
    method: POST
    url: "http://127.0.0.1/api/lists?type=block"
    headers:
      X-FTL-SID: "{{ pihole_api_sid }}"
    body_format: json
    body:
      comment: Ansible
      groups: [0]
      enabled: true
      address: "{{ item }}"
    status_code: [200, 201, 400]
    timeout: "{{ pihole_api_write_timeout }}"
  loop: "{{ pihole_lists_to_add }}"
  loop_control:
    label: "{{ item }}"
  register: pihole_list_results
  changed_when: pihole_list_results.status | default(0) in [200, 201]

- name: Log ignored blocklist API errors
  ansible.builtin.debug:
    msg: >-
      Failed to add {{ item.item }}:
      {{ item.json.error.message | default(item.json | to_json) }}
      ({{ item.json.error.hint | default('no hint') }}) - ignored
  loop: "{{ pihole_list_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status == 400
  changed_when: false

- name: DELETE stale blocklists from the Pi-hole API
  ansible.builtin.uri:
    method: POST
    url: "http://127.0.0.1/api/lists:batchDelete"
    headers:
      X-FTL-SID: "{{ pihole_api_sid }}"
    body_format: json
    body:
      - item: "{{ item }}"
        type: block
    status_code: [204, 404]
    timeout: "{{ pihole_api_write_timeout }}"
  loop: "{{ pihole_lists_to_delete }}"
  loop_control:
    label: "{{ item }}"
  register: pihole_delete_result
  changed_when: pihole_delete_result.status | default(0) == 204

- name: Wait for the Pi-hole lists API to settle after list changes
  ansible.builtin.include_tasks: wait_api.yaml
  when: pihole_lists_changed

- name: Update Pi-hole gravity
  become: true
  become_user: "{{ admin_user }}"
  environment: "{{ podman_rootless_environment }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - "{{ pihole_container_name }}"
      - pihole
      - updateGravity
  register: pihole_gravity
  retries: "{{ pihole_gravity_retries }}"
  delay: "{{ pihole_gravity_delay }}"
  until: pihole_gravity.rc == 0
  when: pihole_lists_changed
  changed_when: pihole_gravity.rc == 0

- name: Delete Pi-hole API session
  ansible.builtin.uri:
    method: DELETE
    url: "http://127.0.0.1/api/auth"
    headers:
      X-FTL-SID: "{{ pihole_api_sid }}"
    status_code: [204]
    timeout: "{{ pihole_api_timeout }}"
  changed_when: false
  when: pihole_lists_changed
