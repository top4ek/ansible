---
pihole_container_name: pihole
pihole_container_dir: "/home/{{ admin_user }}/containers/{{ pihole_container_name }}"
pihole_api_timeout: 30
pihole_api_retries: 20
pihole_api_delay: 15
pihole_api_write_timeout: 300 # add/delete list calls - FTL rewrites gravity rows synchronously
pihole_gravity_retries: 3
pihole_gravity_delay: 30
pihole_data_uid: "1000"
pihole_data_gid: "1000"

pihole:
  timezone: Europe/Moscow
  webpassword: admin
  dhcp_active: "false"
  upstreams: []
  dnsmasq_lines: []
  host_network: true
  hosts: []
  nebula_sync:
    primary: "http://192.168.1.2|admin"
    replicas: "http://192.168.1.3|admin"
    full_sync: "true"
    run_gravity: "true"
    cron: "0 * * * *"
